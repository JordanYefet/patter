name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # macos-15 builds with Xcode 16, without the Liquid Glass APIs;
    # macos-26 builds the glass code too.
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: ./scripts/test.sh

  scripts:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: for f in hooks/*.sh scripts/*.sh; do zsh -n "$f"; done
      - name: Script tests
        run: ./scripts/test-scripts.sh
